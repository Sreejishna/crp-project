<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Student Profile | Cyclic Recruitment Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container py-4">
    <div class="row g-4">
      <!-- Left: Profile Summary Card -->
      <div class="col-lg-4">
        <div class="crp-card p-4 text-center mb-4">
          <div class="brand-icon mx-auto mb-3 bg-primary text-white" style="width: 72px; height: 72px; font-size: 2rem;">
            <i class="bi bi-person"></i>
          </div>
          <h4 class="fw-bold text-dark mb-1" id="profile-card-name">Student Name</h4>
          <div class="text-muted small mb-2" id="profile-card-usn">USN / Degree</div>
          <div class="badge bg-primary fs-6 px-3 py-1 rounded-pill mb-3" id="profile-card-cgpa">8.5 CGPA</div>
          <div id="profile-card-placement" class="mb-3">
            <!-- Placement status -->
          </div>
          <hr>
          <div class="text-start small text-muted">
            <p class="mb-1"><i class="bi bi-info-circle me-1 text-primary"></i> Keep your CGPA and active backlogs updated to receive accurate automated eligibility checks across seasonal hiring drives.</p>
          </div>
        </div>
      </div>

      <!-- Right: Profile Edit Form -->
      <div class="col-lg-8">
        <div class="crp-card p-4">
          <h4 class="fw-bold text-dark mb-3"><i class="bi bi-person-gear text-primary me-2"></i> Update Academic & Professional Details</h4>
          
          <form id="student-profile-form">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Full Name</label>
                <input type="text" id="profile-name" class="form-control" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Email Address (Read-only)</label>
                <input type="email" id="profile-email" class="form-control" readonly disabled>
              </div>

              <div class="col-md-3">
                <label class="form-label small fw-bold">USN / Roll Number</label>
                <input type="text" id="profile-usn" class="form-control" readonly disabled>
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Degree Program</label>
                <input type="text" id="profile-degree" class="form-control">
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Current Academic Year</label>
                <select id="profile-academic-year" class="form-select">
                  <option value="1">1st Year (Fresher)</option>
                  <option value="2">2nd Year (Sophomore)</option>
                  <option value="3">3rd Year (Pre-Final Year)</option>
                  <option value="4" selected>4th Year (Final Year)</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Assigned Department</label>
                <input type="text" id="profile-dept" class="form-control" readonly disabled>
              </div>

              <div class="col-md-3">
                <label class="form-label small fw-bold">Current CGPA (0-10)</label>
                <input type="number" step="0.01" min="0" max="10" id="profile-cgpa" class="form-control" required>
              </div>
              <div class="col-md-3">
                <label class="form-label small fw-bold">Active Arrears / Backlogs</label>
                <input type="number" min="0" id="profile-backlogs" class="form-control" required>
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-bold">10th Score (%)</label>
                <input type="number" step="0.1" min="0" max="100" id="profile-tenth" class="form-control" required>
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-bold">12th Score (%)</label>
                <input type="number" step="0.1" min="0" max="100" id="profile-twelfth" class="form-control" required>
              </div>
              <div class="col-md-2">
                <label class="form-label small fw-bold">Diploma (%)</label>
                <input type="number" step="0.1" min="0" max="100" id="profile-diploma" class="form-control" placeholder="0">
              </div>

              <div class="col-md-12">
                <label class="form-label small fw-bold">Contact Phone Number</label>
                <input type="tel" id="profile-phone" class="form-control">
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Technical & Core Skills (Comma-separated)</label>
                <input type="text" id="profile-skills" class="form-control" placeholder="Java, Spring Boot, React, MongoDB, DSA">
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Professional Bio / Elevator Pitch</label>
                <textarea id="profile-bio" rows="3" class="form-control" placeholder="Brief summary of your technical interests and projects..."></textarea>
              </div>
            </div>

            <button type="submit" class="btn btn-primary-crp px-4 py-2 mt-4">
              <i class="bi bi-check-lg me-1"></i> Save Changes
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!CRP.requireAuth(['student', 'admin', 'department'])) return;
      CRP.renderNavbar('student-profile');
      CRP.renderFooter();
      await Auth.initProfile();
    });
  </script>
</body>
</html>
