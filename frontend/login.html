<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Login | Cyclic Recruitment Portal</title>
  <meta name="description" content="Secure Login for Students, Department Coordinators, and Placement Admin Officers.">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar Container -->
  <div id="navbar-container"></div>

  <!-- Login Main Section -->
  <main class="container my-auto py-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="crp-card p-4 p-md-5 shadow-lg border-0 bg-white">
          
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
              <i class="bi bi-shield-lock"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to access your seasonal recruitment portal</p>
          </div>

          <!-- Role Selector Tabs -->
          <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-3" id="loginRoleTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active py-2 small fw-bold" id="tab-student" type="button" onclick="setRole('student')">
                <i class="bi bi-mortarboard me-1"></i> Student
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link py-2 small fw-bold" id="tab-admin" type="button" onclick="setRole('admin')">
                <i class="bi bi-shield-check me-1"></i> Admin
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link py-2 small fw-bold" id="tab-department" type="button" onclick="setRole('department')">
                <i class="bi bi-diagram-3 me-1"></i> Department
              </button>
            </li>
          </ul>

          <!-- Login Form -->
          <form id="portal-login-form">
            <!-- Email -->
            <div class="mb-3">
              <label for="login-email" class="form-label small fw-bold text-dark">Email Address <span class="text-danger">*</span></label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="login-email" class="form-control" placeholder="name@crp.edu" required autofocus>
              </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="login-password" class="form-label small fw-bold text-dark mb-0">Password <span class="text-danger">*</span></label>
                <a href="#" class="small text-primary text-decoration-none fw-semibold" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal">
                  Forgot Password?
                </a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary" type="button" id="togglePasswordBtn" onclick="togglePasswordVisibility()">
                  <i class="bi bi-eye" id="togglePasswordIcon"></i>
                </button>
              </div>
            </div>

            <!-- Remember Me -->
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="rememberMeCheck" checked>
              <label class="form-check-label small text-muted" for="rememberMeCheck">
                Remember my login session
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-crp w-100 py-2 fs-6 shadow-sm mb-3" id="loginSubmitBtn">
              <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Portal
            </button>

            <!-- Create Account Link -->
            <div class="text-center pt-3 border-top small text-muted">
              Don't have an account yet? 
              <a href="student-register.html" class="fw-bold text-primary text-decoration-none ms-1">
                Create Account <i class="bi bi-arrow-right"></i>
              </a>
            </div>
          </form>

          <!-- Quick Autofill Box -->
          <div class="mt-4 p-3 rounded-3 bg-light border">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="fw-bold text-muted small"><i class="bi bi-lightning-charge text-warning"></i> Demo Fast-Fill:</span>
              <span class="badge bg-secondary">1-Click</span>
            </div>
            <div class="d-flex gap-2 flex-wrap">
              <button type="button" class="btn btn-sm btn-outline-primary py-1 px-2 small" onclick="fillDemo('student')">Student (Rahul)</button>
              <button type="button" class="btn btn-sm btn-outline-danger py-1 px-2 small" onclick="fillDemo('admin')">Admin (Director)</button>
              <button type="button" class="btn btn-sm btn-outline-warning text-dark py-1 px-2 small" onclick="fillDemo('department')">MCA Coordinator</button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <!-- Forgot Password Modal -->
  <div class="modal fade" id="forgotPasswordModal" tabindex="-1" aria-labelledby="forgotPasswordModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="forgotPasswordModalLabel"><i class="bi bi-shield-lock-fill text-primary me-2"></i> Reset Password</h5>
          <button type="button" class="btn-close" data-bs-toggle="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body py-4">
          <p class="text-muted small mb-3">Enter your registered email address and new password to reset your access credentials.</p>
          <form id="forgot-password-form">
            <div class="mb-3">
              <label class="form-label small fw-bold">Registered Email</label>
              <input type="email" id="forgot-email" class="form-control" placeholder="your.name@crp.edu" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">New Password (Min 6 characters)</label>
              <input type="password" id="forgot-new-password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Confirm New Password</label>
              <input type="password" id="forgot-confirm-password" class="form-control" placeholder="••••••••" minlength="6" required>
            </div>
            <button type="submit" class="btn btn-primary-crp w-100 py-2">
              <i class="bi bi-check2-circle me-1"></i> Reset & Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Universal Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    let currentRole = 'student';

    function setRole(role) {
      currentRole = role;
      document.querySelectorAll('#loginRoleTabs .nav-link').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById(`tab-${role}`);
      if (activeBtn) activeBtn.classList.add('active');

      const submitBtn = document.getElementById('loginSubmitBtn');
      if (role === 'admin') {
        submitBtn.innerHTML = `<i class="bi bi-shield-check me-2"></i> Sign In to Admin Placement Portal`;
      } else if (role === 'department') {
        submitBtn.innerHTML = `<i class="bi bi-diagram-3 me-2"></i> Sign In to Department Portal`;
      } else {
        submitBtn.innerHTML = `<i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Student Portal`;
      }
    }

    function fillDemo(role) {
      setRole(role);
      const emailInput = document.getElementById('login-email');
      const passInput = document.getElementById('login-password');
      if (role === 'admin') {
        emailInput.value = 'admin@crp.edu';
        passInput.value = 'admin123';
      } else if (role === 'department') {
        emailInput.value = 'mca.coord@crp.edu';
        passInput.value = 'dept123';
      } else {
        emailInput.value = 'rahul.mca@crp.edu';
        passInput.value = 'student123';
      }
    }

    function togglePasswordVisibility() {
      const passInput = document.getElementById('login-password');
      const icon = document.getElementById('togglePasswordIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.classList.remove('bi-eye');
        icon.classList.add('bi-eye-slash');
      } else {
        passInput.type === 'password';
        icon.classList.remove('bi-eye-slash');
        icon.classList.add('bi-eye');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      CRP.renderNavbar('login');
      CRP.renderFooter();

      // Check query params for role=admin etc.
      const params = new URLSearchParams(window.location.search);
      const requestedRole = params.get('role');
      if (requestedRole && ['student', 'admin', 'department'].includes(requestedRole)) {
        fillDemo(requestedRole);
      } else {
        fillDemo('student');
      }

      // Handle Main Login Form
      document.getElementById('portal-login-form').addEventListener('submit', (e) => {
        Auth.handleLogin(e, currentRole);
      });

      // Handle Forgot Password Form
      document.getElementById('forgot-password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value.trim();
        const newPassword = document.getElementById('forgot-new-password').value;
        const confirmPassword = document.getElementById('forgot-confirm-password').value;

        if (newPassword !== confirmPassword) {
          CRP.toast('New passwords do not match!', 'danger');
          return;
        }

        try {
          CRP.toast('Updating password...', 'info');
          const res = await API.forgotPassword(email, newPassword, confirmPassword);
          if (res.success) {
            CRP.toast(res.message, 'success');
            const modalEl = document.getElementById('forgotPasswordModal');
            const modal = bootstrap.Modal.getInstance(modalEl);
            if (modal) modal.hide();
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = newPassword;
          }
        } catch (err) {
          CRP.toast(err.message, 'danger', 'Reset Failed');
        }
      });
    });
  </script>
</body>
</html>
