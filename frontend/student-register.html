<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Cyclic Recruitment Portal</title>
  <meta name="description" content="Register your student account to access seasonal campus drives, verify company eligibility, view interview rounds, and prepare with curated roadmaps.">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar Container -->
  <div id="navbar-container"></div>

  <!-- Registration Section -->
  <main class="container my-5 flex-grow-1">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <div class="crp-card p-4 p-md-5 shadow-lg border-0 bg-white">
          
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-2 bg-primary text-white" style="width: 52px; height: 52px; font-size: 1.6rem;">
              <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Create Student Account</h3>
            <p class="text-muted small">Join the Cyclic Recruitment Portal for seasonal hiring intelligence</p>
          </div>

          <form id="student-register-form">
            
            <h6 class="fw-bold text-primary border-bottom pb-2 mb-3">
              <i class="bi bi-person-badge me-2"></i> 1. Primary Account Details
            </h6>

            <div class="row g-3 mb-4">
              <!-- Full Name -->
              <div class="col-md-6">
                <label for="reg-name" class="form-label small fw-bold text-dark">Full Name <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-person text-muted"></i></span>
                  <input type="text" id="reg-name" class="form-control" placeholder="e.g. Sreejishna K" required>
                </div>
              </div>

              <!-- Student ID -->
              <div class="col-md-6">
                <label for="reg-student-id" class="form-label small fw-bold text-dark">Student ID / USN <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-card-heading text-muted"></i></span>
                  <input type="text" id="reg-student-id" class="form-control" placeholder="e.g. 1CRP24MCA042" required>
                </div>
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label for="reg-email" class="form-label small fw-bold text-dark">College Email <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" id="reg-email" class="form-control" placeholder="name@crp.edu" required>
                </div>
              </div>

              <!-- Phone -->
              <div class="col-md-6">
                <label for="reg-phone" class="form-label small fw-bold text-dark">Phone Number <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-telephone text-muted"></i></span>
                  <input type="tel" id="reg-phone" class="form-control" placeholder="+91 98765 43210" required>
                </div>
              </div>

              <!-- Password -->
              <div class="col-md-6">
                <label for="reg-password" class="form-label small fw-bold text-dark">Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" id="reg-password" class="form-control" placeholder="Min. 6 characters" minlength="6" required>
                </div>
                <div class="form-text" style="font-size: 0.75rem;">Must be at least 6 characters.</div>
              </div>

              <!-- Confirm Password -->
              <div class="col-md-6">
                <label for="reg-confirm-password" class="form-label small fw-bold text-dark">Confirm Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-white"><i class="bi bi-shield-check text-muted"></i></span>
                  <input type="password" id="reg-confirm-password" class="form-control" placeholder="Re-enter password" minlength="6" required>
                </div>
              </div>
            </div>

            <h6 class="fw-bold text-primary border-bottom pb-2 mb-3">
              <i class="bi bi-mortarboard me-2"></i> 2. Academic & Placement Parameters
            </h6>

            <div class="row g-3 mb-4">
              <!-- Department -->
              <div class="col-md-6">
                <label for="reg-department" class="form-label small fw-bold text-dark">Academic Department</label>
                <select id="reg-department" class="form-select">
                  <option value="">Loading Departments...</option>
                </select>
              </div>

              <!-- Degree -->
              <div class="col-md-6">
                <label for="reg-degree" class="form-label small fw-bold text-dark">Degree / Course</label>
                <select id="reg-degree" class="form-select">
                  <option value="MCA" selected>MCA (Master of Computer Applications)</option>
                  <option value="B.Tech CSE">B.Tech Computer Science</option>
                  <option value="B.Tech ISE">B.Tech Information Science</option>
                  <option value="B.Tech ECE">B.Tech Electronics & Communication</option>
                  <option value="M.Tech">M.Tech Computer Science</option>
                </select>
              </div>

              <!-- Batch Year -->
              <div class="col-md-3">
                <label for="reg-batch" class="form-label small fw-bold text-dark">Graduating Batch</label>
                <select id="reg-batch" class="form-select">
                  <option value="2026" selected>2026 Batch</option>
                  <option value="2025">2025 Batch</option>
                  <option value="2027">2027 Batch</option>
                </select>
              </div>

              <!-- Current CGPA -->
              <div class="col-md-3">
                <label for="reg-cgpa" class="form-label small fw-bold text-dark">Current CGPA</label>
                <input type="number" step="0.01" min="0" max="10" id="reg-cgpa" class="form-control" placeholder="8.50" value="8.50">
              </div>

              <!-- 10th % -->
              <div class="col-md-3">
                <label for="reg-tenth" class="form-label small fw-bold text-dark">10th Score (%)</label>
                <input type="number" step="0.1" min="0" max="100" id="reg-tenth" class="form-control" placeholder="85.0" value="85.0">
              </div>

              <!-- 12th % -->
              <div class="col-md-3">
                <label for="reg-twelfth" class="form-label small fw-bold text-dark">12th Score (%)</label>
                <input type="number" step="0.1" min="0" max="100" id="reg-twelfth" class="form-control" placeholder="85.0" value="85.0">
              </div>

              <!-- Active Backlogs -->
              <div class="col-md-3">
                <label for="reg-backlogs" class="form-label small fw-bold text-dark">Active Backlogs</label>
                <input type="number" min="0" id="reg-backlogs" class="form-control" value="0">
              </div>

              <!-- Technical Skills -->
              <div class="col-md-9">
                <label for="reg-skills" class="form-label small fw-bold text-dark">Technical Skills</label>
                <input type="text" id="reg-skills" class="form-control" placeholder="Java, Python, React, Node.js, SQL, DSA">
                <div class="form-text" style="font-size: 0.75rem;">Comma separated (used for real-time company eligibility matching).</div>
              </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-primary-crp w-100 py-3 fs-6 shadow-sm mb-3">
              <i class="bi bi-person-check-fill me-2"></i> Complete Student Registration
            </button>

            <!-- Login Link -->
            <div class="text-center small text-muted">
              Already have an account? 
              <a href="login.html" class="fw-bold text-primary text-decoration-none ms-1">
                Sign In to Portal <i class="bi bi-box-arrow-in-right"></i>
              </a>
            </div>

          </form>

        </div>
      </div>
    </div>
  </main>

  <!-- Universal Footer -->
  <div id="footer-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      CRP.renderNavbar('register');
      CRP.renderFooter();
      await Auth.loadDepartmentsIntoSelect('reg-department');

      document.getElementById('student-register-form').addEventListener('submit', (e) => {
        Auth.handleStudentRegister(e);
      });
    });
  </script>
</body>
</html>
