<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills & Preparation Roadmaps | Cyclic Recruitment Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <!-- Header -->
  <div class="bg-white border-bottom py-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h2 class="fw-bold mb-1 text-dark"><i class="bi bi-mortarboard text-primary me-2"></i> Skills & Interview Preparation Roadmaps</h2>
          <p class="text-muted small mb-0">Structured domain-wise learning roadmaps, must-solve problems, and company interview questions tailored for cyclic hiring.</p>
        </div>
        <span class="badge bg-primary-subtle text-primary border px-3 py-2 rounded-pill fw-bold">Training & Placement Tracks</span>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <div class="row" id="roadmaps-grid">
      <div class="col-12 text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="text-muted mt-2">Loading Preparation Roadmaps...</p>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/student.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      CRP.renderNavbar('skills-roadmap');
      CRP.renderFooter();
      await StudentApp.initRoadmaps();
    });
  </script>
</body>
</html>
