<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Announcements | Cyclic Recruitment Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <!-- Header -->
  <div class="bg-white border-bottom py-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h2 class="fw-bold mb-1 text-dark"><i class="bi bi-megaphone text-primary me-2"></i> Placement Cell Announcements</h2>
          <p class="text-muted small mb-0">Publish real-time seasonal drive alerts, interview patterns, and general notices to students.</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <div class="row g-4">
      <!-- Create Announcement Form -->
      <div class="col-lg-4">
        <div class="crp-card p-4">
          <h5 class="fw-bold text-dark mb-3"><i class="bi bi-send-fill text-danger me-2"></i> Publish Announcement</h5>
          
          <form id="admin-announcement-form">
            <div class="mb-3">
              <label class="form-label small fw-bold">Notice Title *</label>
              <input type="text" id="ann-input-title" class="form-control" placeholder="e.g. Microsoft Drive Round 1 Shortlist" required>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Category</label>
              <select id="ann-input-category" class="form-select">
                <option value="Seasonal Drive Alert" selected>Seasonal Drive Alert</option>
                <option value="Drive Schedule Update">Drive Schedule Update</option>
                <option value="Eligibility & Shortlist">Eligibility & Shortlist</option>
                <option value="Interview Preparation Tip">Interview Preparation Tip</option>
                <option value="General Placement Notice">General Placement Notice</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Priority Level</label>
              <select id="ann-input-priority" class="form-select">
                <option value="Normal">Normal</option>
                <option value="High" selected>High</option>
                <option value="Urgent">Urgent (Red Alert)</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Target Audience</label>
              <input type="text" id="ann-input-audience" class="form-control" value="All Students">
            </div>

            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="ann-input-pinned">
              <label class="form-check-label small fw-bold" for="ann-input-pinned">Pin this notice to top of student dashboard</label>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-bold">Announcement Content *</label>
              <textarea id="ann-input-content" rows="4" class="form-control" placeholder="Detailed announcement details..." required></textarea>
            </div>

            <button type="submit" class="btn btn-primary-crp w-100 py-2">
              <i class="bi bi-broadcast me-1"></i> Broadcast Announcement
            </button>
          </form>
        </div>
      </div>

      <!-- Announcements List -->
      <div class="col-lg-8">
        <div class="crp-card">
          <div class="crp-card-header">
            <h5 class="fw-bold text-dark mb-0">Published Notice Board</h5>
          </div>
          <div class="table-responsive">
            <table class="crp-table">
              <thead>
                <tr>
                  <th>Title & Summary</th>
                  <th>Category</th>
                  <th>Priority</th>
                  <th>Audience</th>
                  <th>Date</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="admin-announcements-table-body">
                <!-- Injected by admin.js -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!CRP.requireAuth(['admin', 'department'])) return;
      CRP.renderNavbar('admin-announcements');
      CRP.renderFooter();
      await AdminApp.initAnnouncementManagement();
    });
  </script>
</body>
</html>
