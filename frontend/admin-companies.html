<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Company Management | Cyclic Recruitment Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <!-- Header -->
  <div class="bg-white border-bottom py-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h2 class="fw-bold mb-1 text-dark"><i class="bi bi-buildings text-primary me-2"></i> Company Management</h2>
          <p class="text-muted small mb-0">Add, update, and manage seasonal hiring company profiles, cutoffs, and selection parameters.</p>
        </div>
        <button class="btn btn-primary-crp btn-sm px-3" onclick="AdminApp.openAddCompanyModal()">
          <i class="bi bi-plus-circle me-1"></i> Add New Company
        </button>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <!-- Filter Card -->
    <div class="crp-card p-3 mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-6">
          <div class="search-pill-box">
            <i class="bi bi-search text-muted me-2"></i>
            <input type="text" id="admin-company-search" class="search-pill-input" placeholder="Search company by name, industry, skill...">
          </div>
        </div>
        <div class="col-md-3">
          <select id="admin-company-season-filter" class="form-select form-select-sm rounded-pill" onchange="AdminApp.loadCompaniesTable()">
            <option value="All">All Hiring Seasons</option>
            <option value="January">Q1: Jan – Mar</option>
            <option value="April">Q2: Apr – Jun</option>
            <option value="July">Q3: Jul – Sep</option>
            <option value="October">Q4: Oct – Dec</option>
          </select>
        </div>
        <div class="col-md-3 text-md-end">
          <span class="badge bg-light text-dark border p-2 fw-semibold" id="admin-companies-count">Loading...</span>
        </div>
      </div>
    </div>

    <!-- Companies Table -->
    <div class="crp-card">
      <div class="table-responsive">
        <table class="crp-table">
          <thead>
            <tr>
              <th>Company Name & Industry</th>
              <th>Hiring Season</th>
              <th>Package Tier</th>
              <th>CTC Range</th>
              <th>Status</th>
              <th>Min CGPA</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="admin-companies-table-body">
            <tr><td colspan="7" class="text-center py-4 text-muted">Loading companies...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Add / Edit Company Modal -->
  <div class="modal fade" id="adminCompanyModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="company-modal-title">Add New Seasonal Company</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body p-4">
          <form id="admin-company-form">
            <input type="hidden" id="company-id-field">

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Company Name *</label>
                <input type="text" id="comp-input-name" class="form-control" placeholder="e.g. Cisco Systems" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Industry *</label>
                <input type="text" id="comp-input-industry" class="form-control" placeholder="e.g. Computer Networking & Cloud" required>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-bold">Package Tier</label>
                <select id="comp-input-tier" class="form-select">
                  <option value="Super Dream (15+ LPA)">Super Dream (15+ LPA)</option>
                  <option value="Dream (8-15 LPA)" selected>Dream (8-15 LPA)</option>
                  <option value="Tier-1 Core (5-8 LPA)">Tier-1 Core (5-8 LPA)</option>
                  <option value="Mass Recruiter (3.5-5 LPA)">Mass Recruiter (3.5-5 LPA)</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Hiring Season *</label>
                <select id="comp-input-season" class="form-select">
                  <option value="January - March Hiring">Q1: January - March Hiring</option>
                  <option value="April - June Hiring">Q2: April - June Hiring</option>
                  <option value="July - September Hiring" selected>Q3: July - September Hiring</option>
                  <option value="October - December Hiring">Q4: October - December Hiring</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Recruitment Status</label>
                <select id="comp-input-status" class="form-select">
                  <option value="Upcoming">Upcoming</option>
                  <option value="Registration Open">Registration Open</option>
                  <option value="Active / In Progress" selected>Active / In Progress</option>
                  <option value="Completed">Completed</option>
                </select>
              </div>

              <div class="col-md-4">
                <label class="form-label small fw-bold">Salary / CTC Range</label>
                <input type="text" id="comp-input-ctc" class="form-control" placeholder="e.g. 12 - 18 LPA" value="10 - 15 LPA">
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Monthly Stipend (₹)</label>
                <input type="number" id="comp-input-stipend" class="form-control" placeholder="50000" value="45000">
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-bold">Vacancies Count</label>
                <input type="number" id="comp-input-vacancies" class="form-control" value="20">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">Default Location</label>
                <input type="text" id="comp-input-location" class="form-control" value="Bengaluru / Hyderabad">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Work Mode</label>
                <select id="comp-input-workmode" class="form-select">
                  <option value="Hybrid" selected>Hybrid</option>
                  <option value="Onsite">Onsite</option>
                  <option value="Remote">Remote</option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-bold">Min CGPA Required</label>
                <input type="number" step="0.1" id="comp-input-mincgpa" class="form-control" value="7.0">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Max Backlogs Allowed</label>
                <input type="number" id="comp-input-backlogs" class="form-control" value="0">
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Eligible Departments</label>
                <div id="company-eligible-depts-checkboxes" class="p-2 border rounded bg-light">
                  <!-- Checkboxes -->
                </div>
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Required Skills (Comma separated)</label>
                <input type="text" id="comp-input-skills" class="form-control" placeholder="Java, Python, C++, Data Structures, Computer Networks" value="Java, C++, Data Structures, Algorithms">
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Official Website URL</label>
                <input type="url" id="comp-input-website" class="form-control" placeholder="https://company.com">
              </div>

              <div class="col-12">
                <label class="form-label small fw-bold">Company & Recruitment Description *</label>
                <textarea id="comp-input-desc" rows="3" class="form-control" placeholder="Detailed overview of company, teams, and seasonal hiring goals..." required>Global technology leader recruiting software engineering talent for core systems and cloud platforms.</textarea>
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2 mt-4">
              <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary-crp btn-sm px-4">
                <i class="bi bi-save me-1"></i> Save Company Record
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!CRP.requireAuth(['admin'])) return;
      CRP.renderNavbar('admin-companies');
      CRP.renderFooter();
      await AdminApp.initCompanyManagement();
    });
  </script>
</body>
</html>
