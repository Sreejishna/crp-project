<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Database Management | Cyclic Recruitment Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <!-- Header -->
  <div class="bg-white border-bottom py-4">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div>
          <h2 class="fw-bold mb-1 text-dark"><i class="bi bi-people text-primary me-2"></i> Student Records Database</h2>
          <p class="text-muted small mb-0">Monitor student registrations, academic CGPA performance, backlogs, and placement records.</p>
        </div>
        <span class="badge bg-primary-subtle text-primary border px-3 py-2 rounded-pill fw-bold" id="admin-students-count">Loading Students...</span>
      </div>
    </div>
  </div>

  <div class="container py-4">
    <!-- Filter Bar -->
    <div class="crp-card p-3 mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-md-8">
          <div class="search-pill-box">
            <i class="bi bi-search text-muted me-2"></i>
            <input type="text" id="admin-student-search" class="search-pill-input" placeholder="Search by student name, USN, or email...">
          </div>
        </div>
        <div class="col-md-4">
          <select id="admin-student-cgpa-filter" class="form-select form-select-sm rounded-pill" onchange="AdminApp.loadStudentsTable()">
            <option value="">All CGPA Cutoffs</option>
            <option value="8.5">CGPA >= 8.5 (Super Dream)</option>
            <option value="7.5">CGPA >= 7.5 (Dream Tier)</option>
            <option value="6.5">CGPA >= 6.5 (Core Tier)</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Students Table -->
    <div class="crp-card">
      <div class="table-responsive">
        <table class="crp-table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>USN</th>
              <th>Dept / Degree</th>
              <th>CGPA</th>
              <th>Backlogs</th>
              <th>Placement Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="admin-students-table-body">
            <tr><td colspan="7" class="text-center py-4 text-muted">Loading student records...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/admin.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!CRP.requireAuth(['admin'])) return;
      CRP.renderNavbar('admin-students');
      CRP.renderFooter();
      await AdminApp.initStudentManagement();
    });
  </script>
</body>
</html>
