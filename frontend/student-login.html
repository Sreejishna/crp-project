<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Login | Cyclic Recruitment Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="crp-card p-4 p-md-5 shadow-lg border-0">
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3 bg-primary text-white" style="width: 48px; height: 48px; font-size: 1.5rem;">
              <i class="bi bi-person"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Student Login</h4>
            <p class="text-muted small">Access seasonal recruitment drives & company roadmaps</p>
          </div>

          <form id="student-login-form">
            <div class="mb-3">
              <label class="form-label small fw-bold text-dark">College Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="login-email" class="form-control" placeholder="rahul.mca@crp.edu" required value="rahul.mca@crp.edu">
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label small fw-bold text-dark">Password</label>
                <a href="#" class="small text-muted" onclick="alert('For demo accounts, use student123')">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="student123">
              </div>
            </div>

            <button type="submit" class="btn btn-primary-crp w-100 py-2 mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Student Portal
            </button>

            <div class="p-3 bg-light rounded text-center small mb-3 border">
              <span class="text-muted d-block mb-1">Testing Demo Account:</span>
              <code>rahul.mca@crp.edu / student123</code>
            </div>

            <div class="text-center small text-muted">
              Don't have a student account? <br>
              <a href="student-register.html" class="fw-bold text-primary">Register New Student Profile</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CRP.renderNavbar('student-login');
      CRP.renderFooter();

      document.getElementById('student-login-form').addEventListener('submit', (e) => {
        Auth.handleLogin(e, 'student');
      });
    });
  </script>
</body>
</html>
