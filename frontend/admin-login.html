<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Placement Officer Login | Cyclic Recruitment Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

  <div id="navbar-container"></div>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-5 col-lg-4">
        <div class="crp-card p-4 p-md-5 shadow-lg border-0">
          <div class="text-center mb-4">
            <div class="brand-icon mx-auto mb-3 bg-danger text-white" style="width: 48px; height: 48px; font-size: 1.5rem;">
              <i class="bi bi-shield-lock"></i>
            </div>
            <h4 class="fw-bold text-dark mb-1">Placement Cell Admin</h4>
            <p class="text-muted small">Central College Placement Operations</p>
          </div>

          <form id="admin-login-form">
            <div class="mb-3">
              <label class="form-label small fw-bold text-dark">Admin Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" id="login-email" class="form-control" placeholder="admin@crp.edu" required value="admin@crp.edu">
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between">
                <label class="form-label small fw-bold text-dark">Password</label>
                <a href="#" class="small text-muted" onclick="alert('Demo password: admin123')">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-key text-muted"></i></span>
                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required value="admin123">
              </div>
            </div>

            <button type="submit" class="btn btn-danger w-100 py-2 mb-3 fw-bold">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Admin Console
            </button>

            <div class="p-3 bg-light rounded text-center small mb-3 border">
              <span class="text-muted d-block mb-1">Admin Demo Credentials:</span>
              <code>admin@crp.edu / admin123</code>
            </div>

            <div class="text-center small text-muted">
              Student or Faculty? <br>
              <a href="student-login.html" class="fw-bold text-primary">Go to Student Login</a> | <a href="department-login.html" class="fw-bold text-warning">Department Login</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      CRP.renderNavbar('admin-login');
      CRP.renderFooter();

      document.getElementById('admin-login-form').addEventListener('submit', (e) => {
        Auth.handleLogin(e, 'admin');
      });
    });
  </script>
</body>
</html>
